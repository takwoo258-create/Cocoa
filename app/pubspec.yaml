name: cocoa
description: Cocoa 虚拟智能体陪伴系统 Android 客户端
publish_to: 'none'
version: 1.1.0+3

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  fl_chart: ^0.69.0
  image_picker: ^1.1.2
  record: ^6.1.2
  just_audio: ^0.9.40
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
